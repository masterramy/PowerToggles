name: Apply Retired Pulse QA Patch V2

on:
  push:
    branches: [ publication-readiness ]
    paths:
      - '.github/workflows/apply-retired-pulse-qa-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication-readiness
          fetch-depth: 0

      - name: Apply exact retired-control QA edit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/publication_api36_compat_qa.sh')
          text = p.read_text()
          old_comment = '# IDs 38 and 40 legitimately enter through WRITE_SETTINGS. The preceding\n# publication suite leaves the app-op denied, so grant it only for this bounded\n# tranche and return it to denied afterward.\n'
          new_comment = '# ID 38 legitimately enters through WRITE_SETTINGS. The preceding publication\n# suite leaves the app-op denied, so grant it only for this bounded tranche and\n# return it to denied afterward.\n'
          assert text.count(old_comment) == 1, text.count(old_comment)
          text = text.replace(old_comment, new_comment)
          start_marker = '# ID 40 Pulse Notification Light. On hardware without an LED we can still prove\n'
          end_marker = 'adb shell appops set "$PKG" WRITE_SETTINGS deny >/dev/null 2>&1 || true\n'
          assert text.count(start_marker) == 1, text.count(start_marker)
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '# ID 40 Pulse Notification Light is F3-retired from new-user exposure because\n# Android 16 treats notification_light_pulse as a private secure setting. Do not\n# exercise an unsupported historical implementation as a current shipping control.\npulse_result="RETIRED_NOT_EXPOSED"\npulse_before="retired"\npulse_after="retired"\npulse_restored="retired"\nadb shell appops set "$PKG" WRITE_SETTINGS deny >/dev/null 2>&1 || true\n'
          text = text[:start] + replacement + text[end:]
          p.write_text(text)
          PY

      - name: Verify exact intended diff
        run: |
          git diff --check
          git diff -- scripts/publication_api36_compat_qa.sh
          grep -q 'pulse_result="RETIRED_NOT_EXPOSED"' scripts/publication_api36_compat_qa.sh
          if grep -q 'run_probe pulse_toggle' scripts/publication_api36_compat_qa.sh; then exit 1; fi

      - name: Commit bounded QA alignment
        run: |
          git config user.name 'Gate2A QA Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/publication_api36_compat_qa.sh
          git commit -m 'QA: stop exercising retired Pulse control'
          git push origin HEAD:publication-readiness
