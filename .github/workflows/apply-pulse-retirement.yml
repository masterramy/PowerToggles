name: Apply Pulse Retirement Patch

on:
  push:
    branches: [ publication-readiness ]
    paths:
      - '.github/workflows/apply-pulse-retirement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication-readiness
          fetch-depth: 0

      - name: Apply exact retirement edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          picker = Path('src/com/painless/pc/picker/TogglePicker.java')
          text = picker.read_text()
          old = '          new int[] { 4, 5, 25, 10, 27, 15, 40, 43},           // Hardware\n'
          new = '          new int[] { 4, 5, 25, 10, 27, 15, 43},               // Hardware\n'
          assert text.count(old) == 1, f'picker hardware row match count={text.count(old)}'
          text = text.replace(old, new)
          old_comment = '          // hidden Recent Apps 44; deprecated No Lock 45; Wifi Optimize 46;\n          // and the obsolete global Immersive service 47.\n'
          new_comment = '          // Pulse Notification Light 40; hidden Recent Apps 44; deprecated No Lock 45;\n          // Wifi Optimize 46; and the obsolete global Immersive service 47.\n'
          assert text.count(old_comment) == 1, f'picker retirement comment match count={text.count(old_comment)}'
          picker.write_text(text.replace(old_comment, new_comment))

          qa = Path('scripts/publication_runtime_qa.sh')
          text = qa.read_text()
          old_expected = '    "Sync Now", "Screen Light", "Notification Widget", "Widget Settings",\n    "Second Notification Row", "Rotation Lock", "Pulse notification light", "Home Shortcut",\n'
          new_expected = '    "Sync Now", "Screen Light", "Notification Widget", "Widget Settings",\n    "Second Notification Row", "Rotation Lock", "Home Shortcut",\n'
          assert text.count(old_expected) == 1, f'expected-list match count={text.count(old_expected)}'
          text = text.replace(old_expected, new_expected)
          old_retired = '    "Internet calling (SIP)", "Recent Apps", "No Lock Screen", "Wifi Optimize",\n    "Immersive mode",\n'
          new_retired = '    "Internet calling (SIP)", "Pulse notification light", "Recent Apps",\n    "No Lock Screen", "Wifi Optimize", "Immersive mode",\n'
          assert text.count(old_retired) == 1, f'retired-list match count={text.count(old_retired)}'
          qa.write_text(text.replace(old_retired, new_retired))
          PY

      - name: Verify exact intended diff
        run: |
          git diff --check
          git diff -- src/com/painless/pc/picker/TogglePicker.java scripts/publication_runtime_qa.sh
          grep -q 'new int\[\] { 4, 5, 25, 10, 27, 15, 43}' src/com/painless/pc/picker/TogglePicker.java
          ! grep -q 'new int\[\] { 4, 5, 25, 10, 27, 15, 40, 43}' src/com/painless/pc/picker/TogglePicker.java

      - name: Commit bounded retirement
        run: |
          git config user.name 'Gate2A QA Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add src/com/painless/pc/picker/TogglePicker.java scripts/publication_runtime_qa.sh
          git commit -m 'Publication: retire obsolete Pulse Notification Light'
          git push origin HEAD:publication-readiness
