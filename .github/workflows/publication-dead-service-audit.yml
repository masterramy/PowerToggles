name: Publication Dead Service Audit

on:
  push:
    branches: [ publication-readiness ]
  workflow_dispatch:

jobs:
  rlservice-reference-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit RLService references on exact checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "All RLService references:"
          grep -RIn --exclude-dir=.git 'RLService' . || true
          echo
          echo "References outside own source, manifest, and this audit workflow:"
          mapfile -t refs < <(grep -RIl --exclude-dir=.git 'RLService' . \
            | grep -v '^./src/com/painless/pc/RLService.java$' \
            | grep -v '^./AndroidManifest.xml$' \
            | grep -v '^./.github/workflows/publication-dead-service-audit.yml$' || true)
          printf '%s\n' "${refs[@]:-}"
          if [ "${#refs[@]}" -ne 0 ]; then
            echo "RLService still has live repository references; do not delete." >&2
            exit 1
          fi
          echo "RLSERVICE_REFERENCE_AUDIT=PASS_ONLY_SOURCE_AND_MANIFEST"
