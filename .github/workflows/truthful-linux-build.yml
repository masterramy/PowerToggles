name: ToggleBay Truthful Controls Linux Build

on:
  pull_request:
    branches:
      - q3-togglebay-truthful-ci-base-20260928
    paths:
      - build.gradle
      - AndroidManifest.xml
      - src/**
      - res/**
      - .github/workflows/truthful-linux-build.yml

jobs:
  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify truthful-controls source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'DEFAULT_TRACKERS = "2,4,7,9,10,13,15"' src/com/painless/pc/util/SettingsDecoder.java
          grep -F 'LegacySettingsAction.isLegacySettingsOnlyId' src/com/painless/pc/TrackerManager.java
          grep -F 'super(trackerId, pref, R.drawable.icon_prefs)' src/com/painless/pc/tracker/LegacySettingsAction.java
          grep -F 'return super.getLabel(labelArray) + " ⚙"' src/com/painless/pc/tracker/LegacySettingsAction.java
          for id in 0 1 3 5 6 8 11 12 22 24 26; do
            grep -Eq "^[[:space:]]*case ${id}:" src/com/painless/pc/tracker/LegacySettingsAction.java
          done
          ! grep -Eq 'setWifiEnabled|BluetoothAdapter\.enable|BluetoothAdapter\.disable|Settings\.System\.putInt|Settings\.Global\.putInt' src/com/painless/pc/tracker/LegacySettingsAction.java

      - name: Clean build APK and AAB
        run: gradle --no-daemon clean assembleDebug bundleRelease

      - name: Verify outputs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find build/outputs/apk/debug -type f -name '*-debug.apk')
          mapfile -t aabs < <(find build/outputs/bundle/release -type f -name '*.aab')
          test "${#apks[@]}" -eq 1
          test "${#aabs[@]}" -eq 1
          unzip -l "${apks[0]}" | grep -q 'AndroidManifest.xml'
          unzip -l "${aabs[0]}" | grep -q 'BundleConfig.pb'
          sha256sum "${apks[0]}" "${aabs[0]}"
          mkdir -p ci-out
          cp "${apks[0]}" ci-out/ToggleBay-debug.apk
          cp "${aabs[0]}" ci-out/ToggleBay-release.aab

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: togglebay-truthful-controls-linux
          path: ci-out/*
