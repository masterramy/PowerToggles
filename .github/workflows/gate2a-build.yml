name: Gate 2A Android Build

on:
  pull_request:
    branches: [ gate2a-ci-base ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Pin Android AVD paths
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/gate2a-avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/gate2a-android-user" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/gate2a-avd" "$RUNNER_TEMP/gate2a-android-user"

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble debug and release bundle
        run: gradle --no-daemon --stacktrace assembleDebug bundleRelease

      - name: Verify build metadata
        run: |
          APK="build/outputs/apk/debug/PowerToggles-debug.apk"
          if [ ! -f "$APK" ]; then
            APK="$(find build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          fi
          AAB="$(find build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
          test -n "$APK"
          test -f "$APK"
          test -n "$AAB"
          test -f "$AAB"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.painless.pc'" apk-badging.txt
          grep -q "targetSdkVersion:'36'" apk-badging.txt
          unzip -t "$AAB" | tee aab-integrity.txt
          grep -q "No errors detected" aab-integrity.txt
          sha256sum "$APK" "$AAB" | tee build-sha256.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-build-artifacts
          path: |
            ${{ env.APK }}
            ${{ env.AAB }}
            apk-badging.txt
            aab-integrity.txt
            build-sha256.txt
          if-no-files-found: error

      - name: Install API 36 emulator image
        run: sdkmanager "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Create API 36 AVD
        run: |
          echo no | avdmanager create avd --force --name gate2a_api36 --package "system-images;android-36;google_apis;x86_64" --device "pixel_6"
          avdmanager list avd
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx gate2a_api36

      - name: Boot emulator
        run: |
          sudo chmod 666 /dev/kvm || true
          "$ANDROID_HOME/emulator/emulator" -avd gate2a_api36 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > emulator.log 2>&1 &
          EMU_PID=$!
          echo "Emulator PID: $EMU_PID"
          for i in $(seq 1 120); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "Emulator process exited before boot completed"
              cat emulator.log
              exit 1
            fi
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "Emulator booted"
              adb devices -l
              exit 0
            fi
            sleep 2
          done
          echo "Emulator failed to boot within 240 seconds"
          adb devices -l || true
          cat emulator.log
          exit 1

      - name: Install Power Toggles
        run: |
          adb install -r "$APK"
          adb shell pm list packages -f | grep 'com.painless.pc'

      - name: Full API 36 runtime QA and screenshots
        run: bash scripts/gate2a_runtime_qa.sh

      - name: Upload runtime QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2a-runtime-qa-evidence
          path: |
            runtime-evidence/
            emulator.log
          if-no-files-found: warn
