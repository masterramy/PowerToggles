name: ToggleBay Truthful Controls API36 Runtime

on:
  pull_request:
    branches:
      - q3-togglebay-truthful-ci-base-20260928
    paths:
      - src/**
      - res/**
      - qa-debug/**
      - build.gradle
      - AndroidManifest.xml
      - .github/workflows/truthful-runtime-api36.yml

jobs:
  api36-truthful-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Hosted Android SDK root not found: $SDK_ROOT" >&2
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under hosted SDK root: $SDK_ROOT" >&2
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          AVD_HOME="$RUNNER_TEMP/togglebay-avd"
          ANDROID_USER="$RUNNER_TEMP/togglebay-android-user"
          mkdir -p "$AVD_HOME" "$ANDROID_USER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$ANDROID_USER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android API 36 emulator
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "emulator" "system-images;android-36;google_apis;x86_64"
          echo no | avdmanager create avd --force --name togglebay36 --package "system-images;android-36;google_apis;x86_64" --device "pixel_6"
          avdmanager list avd

      - name: Build debug candidate
        run: gradle --no-daemon clean assembleDebug

      - name: Boot API 36 emulator
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/emulator/emulator" -avd togglebay36 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data >/tmp/togglebay-emulator.log 2>&1 &
          EMU_PID=$!
          echo "Emulator PID: $EMU_PID"
          for i in $(seq 1 120); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "Emulator process exited before boot completed" >&2
              cat /tmp/togglebay-emulator.log
              exit 1
            fi
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "Emulator booted"
              adb devices -l
              adb shell input keyevent 82 || true
              adb shell settings put global window_animation_scale 0 || true
              adb shell settings put global transition_animation_scale 0 || true
              adb shell settings put global animator_duration_scale 0 || true
              exit 0
            fi
            sleep 2
          done
          echo "Emulator failed to boot within 240 seconds" >&2
          adb devices -l || true
          cat /tmp/togglebay-emulator.log
          exit 1

      - name: Install exact debug candidate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find build/outputs/apk/debug -type f -name '*-debug.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" /tmp/ToggleBay-debug.apk
          adb install -r /tmp/ToggleBay-debug.apk
          adb shell dumpsys package com.ramybaheeg.togglebay | grep -E 'versionName=1.0.0|versionCode=1' | tee /tmp/package-identity.txt

      - name: Run truthful legacy-actions probe
        shell: bash
        run: |
          set -euo pipefail
          adb logcat -c
          adb shell am force-stop com.ramybaheeg.togglebay
          adb shell am start -W -n com.ramybaheeg.togglebay/com.painless.pc.tracker.Gate2aProbeActivity --es probe legacy_truthful_actions
          sleep 2
          adb shell run-as com.ramybaheeg.togglebay cat shared_prefs/gate2a_probe.xml | tee /tmp/truthful-probe.xml
          grep -F 'name="legacy_truthful_actions_pass" value="true"' /tmp/truthful-probe.xml
          grep -F 'name="legacy_all_actions" value="true"' /tmp/truthful-probe.xml
          grep -F 'name="legacy_all_neutral" value="true"' /tmp/truthful-probe.xml
          grep -F 'name="legacy_expected_intents" value="true"' /tmp/truthful-probe.xml
          grep -F 'name="legacy_settings_labels" value="true"' /tmp/truthful-probe.xml
          grep -F 'name="legacy_key_targets_resolve" value="true"' /tmp/truthful-probe.xml
          grep -F 'name="legacy_default_list_ok" value="true"' /tmp/truthful-probe.xml
          grep -F 'name="legacy_default_list">2,4,7,9,10,13,15</string>' /tmp/truthful-probe.xml
          if adb logcat -d | grep -E 'FATAL EXCEPTION|ANR in com\.ramybaheeg\.togglebay'; then
            echo 'Unexpected crash/ANR in truthful-controls probe' >&2
            exit 1
          fi

      - name: Preserve runtime evidence
        if: always()
        shell: bash
        run: |
          mkdir -p truthful-runtime-evidence
          cp /tmp/truthful-probe.xml truthful-runtime-evidence/ 2>/dev/null || true
          cp /tmp/package-identity.txt truthful-runtime-evidence/ 2>/dev/null || true
          cp /tmp/togglebay-emulator.log truthful-runtime-evidence/ 2>/dev/null || true
          adb logcat -d > truthful-runtime-evidence/logcat.txt 2>/dev/null || true
          sha256sum /tmp/ToggleBay-debug.apk > truthful-runtime-evidence/apk-sha256.txt 2>/dev/null || true

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: togglebay-truthful-controls-api36-runtime
          path: truthful-runtime-evidence/
