name: Q1 ToggleBay Integration

on:
  workflow_dispatch:

jobs:
  q1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Identity source diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo '== public package metadata =='
          grep -nE 'namespace|applicationId|versionCode|versionName|targetSdkVersion' build.gradle
          echo '== remaining hardcoded public namespace literals in production Java =='
          grep -RInE '"com\.painless\.pc\.(file|permission\.|ACTION_|CUSTOM_ACTION|BATTERY_POLL)' src || true
          echo '== FileProvider consumers =='
          grep -RInE 'FileProvider\.(FOLDER_SHARE_URI|WIDGET_SHARE_URI|CROP_URI|widgetBackUri|folderShareFile|widgetShareFile|cropFile|tempBackImage)' src || true
          echo '== literal provider URI consumers =='
          grep -RInF 'content://com.painless.pc.file' src res AndroidManifest.xml qa scripts || true
          echo '== Globals public-identity constant consumers =='
          grep -RInE 'Globals\.(PLUGIN_INTENT|SIGNAURE_PERMISSION|CUSTOM_ACTION)' src || true
          echo '== all SIGNAURE_PERMISSION references =='
          grep -RIn 'SIGNAURE_PERMISSION' src || true
          echo '== legacy customer-visible branding candidates =='
          grep -RInEi 'Power[[:space:]]*Toggles|Power[[:space:]]*Toggle|Power[[:space:]]*Toogle' res release-identity README.md || true
          echo '== package-dependent QA/script references =='
          grep -RInE 'com\.painless\.pc|content://com\.painless\.pc' qa scripts > q1-package-couplings.txt || true
          cat q1-package-couplings.txt

      - name: Build debug and release
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon clean assembleDebug bundleRelease

      - name: Inspect merged ToggleBay identity
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_MANIFEST="$(find build/intermediates \( -path '*merged_manifest*debug*AndroidManifest.xml' -o -path '*merged_manifests*debug*AndroidManifest.xml' \) | head -1)"
          RELEASE_MANIFEST="$(find build/intermediates \( -path '*merged_manifest*release*AndroidManifest.xml' -o -path '*merged_manifests*release*AndroidManifest.xml' \) | head -1)"
          echo "DEBUG_MANIFEST=$DEBUG_MANIFEST"
          echo "RELEASE_MANIFEST=$RELEASE_MANIFEST"
          test -n "$DEBUG_MANIFEST"
          test -n "$RELEASE_MANIFEST"
          grep -n 'package="com.ramybaheeg.togglebay"' "$DEBUG_MANIFEST"
          grep -n 'package="com.ramybaheeg.togglebay"' "$RELEASE_MANIFEST"
          grep -n 'com.ramybaheeg.togglebay.file' "$DEBUG_MANIFEST"
          grep -n 'com.ramybaheeg.togglebay.file' "$RELEASE_MANIFEST"
          grep -n 'com.painless.pc.togglebay.FileProvider' "$DEBUG_MANIFEST"
          grep -n 'com.painless.pc.togglebay.FileProvider' "$RELEASE_MANIFEST"
          grep -n 'com.painless.pc.togglebay.PluginUpdateReceiver' "$DEBUG_MANIFEST"
          grep -n 'com.painless.pc.togglebay.PluginUpdateReceiver' "$RELEASE_MANIFEST"
          grep -n 'com.painless.pc.settings.LaunchActivity' "$DEBUG_MANIFEST"
          grep -n 'com.painless.pc.settings.LaunchActivity' "$RELEASE_MANIFEST"
          ! grep -q 'android:authorities="com.painless.pc.file"' "$DEBUG_MANIFEST"
          ! grep -q 'android:authorities="com.painless.pc.file"' "$RELEASE_MANIFEST"

      - name: Fail closed on packaged legacy customer branding
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          echo "APK=$APK"
          echo "AAPT2=$AAPT2"
          test -f "$APK"
          test -x "$AAPT2"
          "$AAPT2" dump resources "$APK" > q1-packaged-resources.txt
          if ! awk '
            /^resource .* string\// { name=$3 }
            {
              low=tolower($0)
              if (low ~ /power[[:space:]]*toggles/ || low ~ /power[[:space:]]*toggle/ || low ~ /power[[:space:]]*toogle/) {
                if (name !~ /string\/stat_open_source_summary$/ && name !~ /string\/stat_license_summary$/) {
                  print name ": " $0
                  bad=1
                }
              }
            }
            END { exit bad ? 1 : 0 }
          ' q1-packaged-resources.txt > q1-unexpected-legacy-brand.txt; then
            echo 'Unexpected packaged historical branding:'
            cat q1-unexpected-legacy-brand.txt
            exit 1
          fi
          echo 'Packaged customer-brand leak gate: PASS'

      - name: Package Q1 evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p q1-evidence
          git rev-parse HEAD > q1-evidence/head.txt
          git rev-parse HEAD^{tree} > q1-evidence/tree.txt
          git status --short > q1-evidence/git-status.txt
          cp build.gradle AndroidManifest.xml README.md q1-evidence/ 2>/dev/null || true
          cp q1-package-couplings.txt q1-packaged-resources.txt q1-unexpected-legacy-brand.txt q1-evidence/ 2>/dev/null || true
          if [ -d build/intermediates ]; then
            find build/intermediates \( -path '*merged_manifest*AndroidManifest.xml' -o -path '*merged_manifests*debug*AndroidManifest.xml' \) \
              | while read -r f; do cp "$f" "q1-evidence/$(echo "$f" | tr '/' '_')" || true; done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q1-togglebay-${{ github.sha }}
          path: q1-evidence
          if-no-files-found: error
