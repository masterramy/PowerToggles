name: Apply Retired Pulse QA Patch

on:
  push:
    branches: [ publication-readiness ]
    paths:
      - '.github/workflows/apply-retired-pulse-qa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication-readiness
          fetch-depth: 0

      - name: Patch retired control out of shipping compatibility exercise
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/publication_api36_compat_qa.sh')
          text = p.read_text()
          old = '''# IDs 38 and 40 legitimately enter through WRITE_SETTINGS. The preceding
# publication suite leaves the app-op denied, so grant it only for this bounded
# tranche and return it to denied afterward.
'''
          new = '''# ID 38 legitimately enters through WRITE_SETTINGS. The preceding publication
# suite leaves the app-op denied, so grant it only for this bounded tranche and
# return it to denied afterward.
'''
          assert text.count(old) == 1, f'write-settings comment count={text.count(old)}'
          text = text.replace(old, new)
          old = '''# ID 40 Pulse Notification Light. On hardware without an LED we can still prove
# the shipping WRITE_SETTINGS behavior is safe and restorable; physical LED
# illumination remains a separate device requirement.
pulse_before="$(adb shell settings get system notification_light_pulse | tr -d '\\r')"
adb shell am force-stop "$PKG" || true
adb logcat -c || true
run_probe pulse_prepare || true
run_probe pulse_toggle || true
sleep 2
pulse_after="$(adb shell settings get system notification_light_pulse | tr -d '\\r')"
capture_log 53-pulse-light-toggled
if app_fatal "$OUT/logs/53-pulse-light-toggled.logcat.txt"; then
  pulse_result="FAIL_FATAL"
  fail=1
elif [ "$pulse_before" = "$pulse_after" ]; then
  pulse_result="FAIL_NO_MUTATION"
  fail=1
else
  pulse_result="PASS_SETTING_MUTATION"
fi
run_probe pulse_restore || true
sleep 1
pulse_restored="$(adb shell settings get system notification_light_pulse | tr -d '\\r')"
if [ "$pulse_restored" != "$pulse_before" ]; then
  pulse_result="${pulse_result}+FAIL_RESTORE"
  fail=1
fi
adb shell appops set "$PKG" WRITE_SETTINGS deny >/dev/null 2>&1 || true
'''
          new = '''# ID 40 Pulse Notification Light is F3-retired from new-user exposure because
# Android 16 treats notification_light_pulse as a private secure setting. Do not
# exercise an unsupported historical implementation as a current shipping control.
pulse_result="RETIRED_NOT_EXPOSED"
pulse_before="retired"
pulse_after="retired"
pulse_restored="retired"
adb shell appops set "$PKG" WRITE_SETTINGS deny >/dev/null 2>&1 || true
'''
          assert text.count(old) == 1, f'pulse block count={text.count(old)}'
          p.write_text(text.replace(old, new))
          PY

      - name: Verify exact intended diff
        run: |
          git diff --check
          git diff -- scripts/publication_api36_compat_qa.sh
          grep -q 'pulse_result="RETIRED_NOT_EXPOSED"' scripts/publication_api36_compat_qa.sh
          ! grep -q 'run_probe pulse_toggle' scripts/publication_api36_compat_qa.sh

      - name: Commit bounded QA alignment
        run: |
          git config user.name 'Gate2A QA Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/publication_api36_compat_qa.sh
          git commit -m 'QA: stop exercising retired Pulse control'
          git push origin HEAD:publication-readiness
