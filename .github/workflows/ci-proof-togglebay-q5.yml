name: Frozen ToggleBay Q5 Proof

on:
  push:
    branches: [ ci-proof-togglebay-q5-20260912 ]

jobs:
  q5-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Q4-r2 candidate source
        uses: actions/checkout@v4
        with:
          ref: fe4f6ef19a08f9c79fdc2f626bac0f3b8d6635fa
          fetch-depth: 1

      - name: Verify exact frozen candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fe4f6ef19a08f9c79fdc2f626bac0f3b8d6635fa"
          test "$(git rev-parse 'HEAD^{tree}')" = "89d9700c88f60ebba41f9c7423d8f9f70cda4333"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD | tee q5-candidate-head.txt
          git rev-parse 'HEAD^{tree}' | tee q5-candidate-tree.txt

      - name: Static publication contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/publication_noactions_static_qa.sh
          bash scripts/publication_modern_radio_static_qa.sh
          bash scripts/publication_lifecycle_input_static_qa.sh
          bash scripts/publication_immersive_window_static_qa.sh
          bash scripts/publication_plugin_receiver_static_qa.sh
          bash scripts/publication_tasker_ingress_static_qa.sh
          bash scripts/publication_call_shortcut_static_qa.sh
          bash scripts/publication_internal_activity_export_static_qa.sh
          bash scripts/publication_hidden_api_static_qa.sh
          bash scripts/publication_retired_f3_static_qa.sh
          bash scripts/publication_widget_provider_static_qa.sh
          bash scripts/publication_backup_privacy_static_qa.sh
          bash scripts/publication_tile_import_static_qa.sh
          bash scripts/publication_preidentity_package_static_qa.sh
          bash scripts/publication_tracker_definition_static_qa.sh
          bash scripts/publication_legacy_widget_db_static_qa.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36 dependencies
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build exact Q4-r2 candidate
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug bundleRelease
          APK="$(find build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          AAB="$(find build/outputs/bundle/release -type f -name '*.aab' | head -n1)"
          test -f "$APK"; test -f "$AAB"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee q5-apk-badging.txt
          grep -q "package: name='com.ramybaheeg.togglebay' versionCode='1' versionName='1.0.0'" q5-apk-badging.txt
          grep -q "targetSdkVersion:'36'" q5-apk-badging.txt
          unzip -t "$AAB" | tee q5-aab-integrity.txt
          grep -q "No errors detected" q5-aab-integrity.txt
          sha256sum "$APK" "$AAB" | tee q5-build-sha256.txt

      - name: Create and boot API 36 emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/togglebay-avd"
          export ANDROID_USER_HOME="$RUNNER_TEMP/togglebay-android-user"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo no | avdmanager create avd --force --name togglebay_api36 --package "system-images;android-36;google_apis;x86_64" --device pixel_6
          sudo chmod 666 /dev/kvm || true
          "$ANDROID_HOME/emulator/emulator" -avd togglebay_api36 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > q5-emulator.log 2>&1 &
          EMU_PID=$!
          echo "EMU_PID=$EMU_PID" >> "$GITHUB_ENV"
          for i in $(seq 1 120); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then cat q5-emulator.log; exit 1; fi
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then adb devices -l; exit 0; fi
            sleep 2
          done
          cat q5-emulator.log
          exit 1

      - name: Install and verify ToggleBay package boundary
        shell: bash
        run: |
          set -euo pipefail
          APP_ID="com.ramybaheeg.togglebay"
          adb uninstall com.painless.pc >/dev/null 2>&1 || true
          adb install -r "$APK"
          adb shell pm path "$APP_ID" | tee q5-package-path.txt
          grep -q '^package:' q5-package-path.txt
          if adb shell pm path com.painless.pc | grep -q '^package:'; then
            echo 'Historical public package unexpectedly installed' >&2
            exit 1
          fi
          mkdir -p q5-state q5-screens q5-ui
          adb shell dumpsys package "$APP_ID" > q5-state/baseline-package.txt
          grep -q 'com.ramybaheeg.togglebay.file' q5-state/baseline-package.txt
          adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$APP_ID" | tee q5-state/launcher-resolution.txt
          grep -q 'com.ramybaheeg.togglebay/com.painless.pc.settings.LaunchActivity' q5-state/launcher-resolution.txt
          adb shell dumpsys activity activities > q5-state/baseline-activities.txt
          adb shell dumpsys window windows > q5-state/baseline-windows.txt
          adb logcat -c

      - name: Render and read back ToggleBay Info privacy and attribution
        shell: bash
        run: |
          set -euo pipefail
          APP_ID="com.ramybaheeg.togglebay"
          adb shell am force-stop "$APP_ID"
          adb shell am start -W -n "$APP_ID/com.painless.pc.settings.LaunchActivity" --es ':android:show_fragment' 'com.painless.pc.nav.InfoFrag' | tee q5-state/info-launch.txt
          sleep 2
          adb shell uiautomator dump /sdcard/q5-info.xml >/dev/null
          adb pull /sdcard/q5-info.xml q5-ui/info.xml >/dev/null
          adb exec-out screencap -p > q5-screens/info.png
          test -s q5-ui/info.xml
          test -s q5-screens/info.png
          grep -q 'Privacy' q5-ui/info.xml
          grep -q 'Open source' q5-ui/info.xml
          grep -q 'MIT License' q5-ui/info.xml
          grep -q 'ToggleBay has no account, ads SDK, analytics SDK' q5-ui/info.xml
          grep -q 'independent modern Android utility' q5-ui/info.xml
          grep -q '2015 sunnygoyal' q5-ui/info.xml
          adb shell dumpsys activity activities > q5-state/info-activities.txt
          grep -q 'com.ramybaheeg.togglebay/com.painless.pc.settings.LaunchActivity' q5-state/info-activities.txt

      - name: Exhaust runtime and fidelity suites
        shell: bash
        run: |
          overall_rc=0
          run_suite() {
            local script="$1"; shift || true
            echo "=== RUN $script ==="
            bash "$script" "$@"
            local rc=$?
            if [ "$rc" -ne 0 ]; then echo "=== RED $script rc=$rc ==="; overall_rc=1; else echo "=== PASS $script ==="; fi
            return 0
          }
          set +e
          run_suite scripts/publication_qa_harness_prepare.sh
          run_suite scripts/publication_qa_harness_followup.sh
          run_suite scripts/publication_qa_harness_final.sh
          run_suite scripts/publication_qa_harness_restore_final.sh
          run_suite scripts/gate2a_runtime_qa.sh
          run_suite scripts/gate2a_fidelity_qa.sh fidelity-evidence
          run_suite scripts/publication_runtime_qa.sh
          run_suite scripts/publication_import_export_qa.sh
          run_suite scripts/publication_folder_backup_share_qa.sh
          run_suite scripts/publication_settings_route_qa.sh
          run_suite scripts/publication_write_settings_qa.sh
          run_suite scripts/publication_media_ui_qa.sh
          run_suite scripts/publication_media_behavior_qa.sh
          run_suite scripts/publication_rotation_setting_qa.sh
          run_suite scripts/publication_api36_compat_qa.sh
          run_suite scripts/publication_screen_on_card_qa.sh
          run_suite scripts/publication_rotation_picker_qa.sh
          original_stay_on="$(adb shell settings get global stay_on_while_plugged_in | tr -d '\r')"
          adb shell settings put global stay_on_while_plugged_in 0
          run_suite scripts/publication_remaining_controls_qa.sh
          run_suite scripts/publication_next_controls_qa.sh
          run_suite scripts/publication_widget_settings_qa.sh
          if [ "$original_stay_on" = "null" ] || [ -z "$original_stay_on" ]; then adb shell settings delete global stay_on_while_plugged_in; else adb shell settings put global stay_on_while_plugged_in "$original_stay_on"; fi
          set -e
          exit "$overall_rc"

      - name: Verify shipping-source immutability after QA
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p q5-state
          git diff --name-only > q5-state/tracked-dirty-files.txt
          if grep -E '^(src/|res/|release-identity/|AndroidManifest\.xml$|build\.gradle$)' q5-state/tracked-dirty-files.txt | tee q5-state/shipping-source-drift.txt | grep -q .; then
            echo 'Shipping source drifted during Q5' >&2
            exit 1
          fi
          : > q5-state/shipping-source-drift.txt
          echo 'Shipping source immutability: PASS'

      - name: Capture final exact-candidate state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p q5-state q5-screens
          adb wait-for-device
          adb shell dumpsys package com.ramybaheeg.togglebay > q5-state/final-package.txt
          adb shell dumpsys activity activities > q5-state/final-activities.txt
          adb shell dumpsys window windows > q5-state/final-windows.txt
          adb logcat -d -v threadtime > q5-state/final-logcat.txt
          adb exec-out screencap -p > q5-screens/final.png
          test -s q5-screens/final.png
          git rev-parse HEAD > q5-state/final-head.txt
          git rev-parse 'HEAD^{tree}' > q5-state/final-tree.txt
          git status --porcelain --untracked-files=no > q5-state/final-tracked-dirty.txt
          test "$(cat q5-state/final-head.txt)" = "fe4f6ef19a08f9c79fdc2f626bac0f3b8d6635fa"
          test "$(cat q5-state/final-tree.txt)" = "89d9700c88f60ebba41f9c7423d8f9f70cda4333"
          grep -q 'com.ramybaheeg.togglebay.file' q5-state/final-package.txt

      - name: Upload frozen Q5 proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: togglebay-q5-proof-fe4f6ef1
          retention-days: 1
          if-no-files-found: warn
          path: |
            q5-candidate-head.txt
            q5-candidate-tree.txt
            q5-apk-badging.txt
            q5-aab-integrity.txt
            q5-build-sha256.txt
            q5-package-path.txt
            ${{ env.APK }}
            ${{ env.AAB }}
            runtime-evidence/
            fidelity-evidence/
            q5-state/
            q5-screens/
            q5-ui/
            q5-emulator.log
