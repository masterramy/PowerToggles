name: Q3 Normalize ToggleBay QA

on:
  push:
    branches:
      - togglebay-q3-integration-20260912
    paths:
      - .github/workflows/q3-normalize-togglebay-qa.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize remaining runtime identity assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = sorted(Path('scripts').glob('*.sh'))

          exact = [
              ('Process: com\\.painless\\.pc', 'Process: com\\.ramybaheeg\\.togglebay'),
              ('ANR in com\\.painless\\.pc', 'ANR in com\\.ramybaheeg\\.togglebay'),
              ('am_crash.*com\\.painless\\.pc', 'am_crash.*com\\.ramybaheeg\\.togglebay'),
              ('am_anr.*com\\.painless\\.pc', 'am_anr.*com\\.ramybaheeg\\.togglebay'),
              ('Allow Power Toggles to send you notifications?', 'Allow ToggleBay to send you notifications?'),
              ('pkg=com\\.painless\\.pc', 'pkg=com\\.ramybaheeg\\.togglebay'),
              ('Power Toggles notification remained active after disabling', 'ToggleBay notification remained active after disabling'),
          ]

          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              new = text
              for before, after in exact:
                  new = new.replace(before, after)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for p in changed:
              print(p)
          if not changed:
              raise SystemExit('No remaining runtime-identity assertion changes produced')

          forbidden = [
              'Process: com\\.painless\\.pc',
              'ANR in com\\.painless\\.pc',
              'am_crash.*com\\.painless\\.pc',
              'am_anr.*com\\.painless\\.pc',
              'Allow Power Toggles to send you notifications?',
              'pkg=com\\.painless\\.pc',
              'Power Toggles notification remained active after disabling',
          ]
          stale=[]
          for path in files:
              text=path.read_text(encoding='utf-8')
              for needle in forbidden:
                  if needle in text:
                      stale.append((str(path), needle))
          if stale:
              for item in stale:
                  print('STALE', *item)
              raise SystemExit(2)
          print('Known stale runtime-identity assertions: ZERO')

          print('Remaining historical-brand mentions in scripts (review only):')
          import re
          pat=re.compile(r'power\s*toggle', re.I)
          for path in files:
              for lineno,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if pat.search(line):
                      print(f'{path}:{lineno}:{line}')
          PY

      - name: Commit normalized QA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'qa: align runtime assertions with ToggleBay identity'
          git push origin HEAD:togglebay-q3-integration-20260912
