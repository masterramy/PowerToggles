name: Q3 Normalize ToggleBay QA

on:
  push:
    branches:
      - togglebay-q3-integration-20260912
    paths:
      - .github/workflows/q3-normalize-togglebay-qa.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize final QA labels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = sorted(Path('scripts').glob('*.sh'))
          changed=[]
          for path in files:
              text=path.read_text(encoding='utf-8')
              new=text.replace('Power Toggles','ToggleBay')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('Changed files:')
          for p in changed:
              print(p)
          if not changed:
              raise SystemExit('No historical QA labels found to normalize')

          pat=re.compile(r'power\s*toggle', re.I)
          stale=[]
          for path in files:
              for lineno,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if pat.search(line):
                      stale.append((str(path),lineno,line))
          if stale:
              for item in stale:
                  print('STALE', *item)
              raise SystemExit(2)
          print('Historical Power Toggle labels in scripts: ZERO')
          PY

      - name: Commit normalized QA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'qa: clean final harness labels for ToggleBay'
          git push origin HEAD:togglebay-q3-integration-20260912
