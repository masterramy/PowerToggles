name: ToggleBay r3 identity fix once

on:
  push:
    branches:
      - togglebay-q3-integration-20260912

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'ci-r3-product-patch-final' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: togglebay-q3-integration-20260912
          fetch-depth: 0
      - name: Apply exact r3 product correction
        shell: bash
        run: |
          set -euo pipefail
          BASE=fe4f6ef19a08f9c79fdc2f626bac0f3b8d6635fa
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git diff --name-only "$BASE" HEAD)" = ".github/workflows/r3-identity-fix-once.yml"
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/com/painless/pc/util/ImportExportActivity.java'): [
                  ('"power-toggles-backup" + fileExtension', '"togglebay-widget" + fileExtension'),
              ],
              Path('src/com/painless/pc/cfg/WidgetConfigActivity.java'): [
                  ('private static final String DEFAULT_THEME_NAME = "power-toggles-theme" + THEME_EXTENSION;',
                   'private static final String DEFAULT_THEME_NAME = "togglebay-theme" + THEME_EXTENSION;'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one preimage for {old!r}, found {text.count(old)}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          gate = Path('scripts/publication_backup_privacy_static_qa.sh')
          text = gate.read_text(encoding='utf-8')
          anchor = 'echo "PASS: backup keeps user migration while excluding ephemeral capabilities/share artifacts"\n'
          extra = '''\n# ToggleBay public export filenames must not regress to historical branding.\nIMPORT_EXPORT="$ROOT/src/com/painless/pc/util/ImportExportActivity.java"\nWIDGET_CONFIG="$ROOT/src/com/painless/pc/cfg/WidgetConfigActivity.java"\nif grep -RInEi 'power-toggles-(backup|theme)' "$ROOT/src"; then\n  fail "Historical customer-visible export filename remains"\nfi\ngrep -Fq '\"togglebay-widget\" + fileExtension' "$IMPORT_EXPORT" || fail "ToggleBay backup document filename contract missing"\ngrep -Fq 'DEFAULT_THEME_NAME = \"togglebay-theme\" + THEME_EXTENSION' "$WIDGET_CONFIG" || fail "ToggleBay theme filename contract missing"\n\necho "PASS: ToggleBay customer-visible export filenames are independent of historical branding"\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'static gate anchor count={text.count(anchor)}')
          text = text.replace(anchor, extra + anchor)
          gate.write_text(text, encoding='utf-8')
          PY
          git diff --check
          ACTUAL="$(git diff --name-only HEAD | sort)"
          EXPECTED="$(printf '%s\n' scripts/publication_backup_privacy_static_qa.sh src/com/painless/pc/cfg/WidgetConfigActivity.java src/com/painless/pc/util/ImportExportActivity.java | sort)"
          test "$ACTUAL" = "$EXPECTED"
      - name: Commit exact r3 product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gate 2A Apps Alfred'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/publication_backup_privacy_static_qa.sh src/com/painless/pc/cfg/WidgetConfigActivity.java src/com/painless/pc/util/ImportExportActivity.java
          git commit -m 'release: remove legacy export filenames for ToggleBay'
          git push origin HEAD:togglebay-q3-integration-20260912
