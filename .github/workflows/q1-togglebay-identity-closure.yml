name: Q1 ToggleBay Identity Closure

on:
  push:
    branches:
      - q3-togglebay-identity-closure-20260913
  workflow_dispatch:

jobs:
  q1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify static publication contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/publication_noactions_static_qa.sh
          bash scripts/publication_modern_radio_static_qa.sh
          bash scripts/publication_lifecycle_input_static_qa.sh
          bash scripts/publication_immersive_window_static_qa.sh
          bash scripts/publication_plugin_receiver_static_qa.sh
          bash scripts/publication_tasker_ingress_static_qa.sh
          bash scripts/publication_call_shortcut_static_qa.sh
          bash scripts/publication_internal_activity_export_static_qa.sh
          bash scripts/publication_hidden_api_static_qa.sh
          bash scripts/publication_retired_f3_static_qa.sh
          bash scripts/publication_widget_provider_static_qa.sh
          bash scripts/publication_backup_privacy_static_qa.sh
          bash scripts/publication_tile_import_static_qa.sh
          bash scripts/publication_preidentity_package_static_qa.sh
          bash scripts/publication_tracker_definition_static_qa.sh
          bash scripts/publication_legacy_widget_db_static_qa.sh

      - name: Verify public backup and share identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DEFAULT_BACKUP_NAME = "togglebay-widget.zip"' src/com/painless/pc/nav/HomeFrag.java
          grep -Fq 'ToggleBay widget backup' src/com/painless/pc/nav/HomeFrag.java
          grep -Fq 'BACKUP_FILE_NAME = "togglebay-folders.pcf"' src/com/painless/pc/nav/FolderFrag.java
          grep -Fq 'ToggleBay folder backup' src/com/painless/pc/nav/FolderFrag.java
          grep -Fq '"togglebay-backup" + fileExtension' src/com/painless/pc/util/ImportExportActivity.java
          ! grep -REn 'power-toggles-(widget|folders|backup)|Power Toggles (widget|folder) backup' \
            src/com/painless/pc/nav/HomeFrag.java src/com/painless/pc/nav/FolderFrag.java src/com/painless/pc/util/ImportExportActivity.java

      - name: Build debug and release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug bundleRelease

      - name: Inspect merged and packaged ToggleBay identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          AAB="$(find build/outputs/bundle/release -type f -name '*.aab' | head -1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          test -f "$APK"
          test -f "$AAB"
          test -x "$AAPT2"
          "$AAPT2" dump badging "$APK" | tee q1-apk-badging.txt
          grep -q "package: name='com.ramybaheeg.togglebay'" q1-apk-badging.txt
          grep -q "application-label:'ToggleBay'" q1-apk-badging.txt
          grep -q "targetSdkVersion:'36'" q1-apk-badging.txt
          unzip -t "$AAB" | tee q1-aab-integrity.txt
          grep -q 'No errors detected' q1-aab-integrity.txt
          sha256sum "$APK" "$AAB" | tee q1-build-sha256.txt

          DEBUG_MANIFEST="$(find build/intermediates \( -path '*merged_manifest*debug*AndroidManifest.xml' -o -path '*merged_manifests*debug*AndroidManifest.xml' \) | head -1)"
          RELEASE_MANIFEST="$(find build/intermediates \( -path '*merged_manifest*release*AndroidManifest.xml' -o -path '*merged_manifests*release*AndroidManifest.xml' \) | head -1)"
          test -n "$DEBUG_MANIFEST"
          test -n "$RELEASE_MANIFEST"
          cp "$DEBUG_MANIFEST" q1-debug-merged-manifest.xml
          cp "$RELEASE_MANIFEST" q1-release-merged-manifest.xml
          for manifest in "$DEBUG_MANIFEST" "$RELEASE_MANIFEST"; do
            grep -q 'package="com.ramybaheeg.togglebay"' "$manifest"
            grep -q 'android:authorities="com.ramybaheeg.togglebay.file"' "$manifest"
            grep -Eq 'android:name="(com\.painless\.pc\.)?FileProvider"' "$manifest"
            grep -Eq 'android:name="(com\.painless\.pc\.)?PluginUpdateReceiver"' "$manifest"
            grep -q 'com.painless.pc.settings.LaunchActivity' "$manifest"
            ! grep -q 'android:authorities="com.painless.pc.file"' "$manifest"
          done

      - name: Fail closed on packaged active historical branding
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          "$AAPT2" dump resources "$APK" > q1-packaged-resources.txt
          if ! awk '
            /^[[:space:]]*resource .* string\// { name=$3 }
            {
              low=tolower($0)
              if (low ~ /power[[:space:]-]*toggles/ || low ~ /power[[:space:]-]*toggle/ || low ~ /power[[:space:]-]*toogle/ || low ~ /powertoggles/) {
                if (name !~ /string\/togglebay_license_summary/ &&
                    name !~ /string\/stat_open_source_summary/ &&
                    name !~ /string\/stat_license_summary/) {
                  print name ": " $0
                  bad=1
                }
              }
            }
            END { exit bad ? 1 : 0 }
          ' q1-packaged-resources.txt > q1-unexpected-legacy-brand.txt; then
            echo 'Unexpected packaged historical branding:'
            cat q1-unexpected-legacy-brand.txt
            exit 1
          fi
          echo 'Packaged active historical-brand leak gate: PASS'

      - name: Self-test ToggleBay QA identity translator
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/togglebay_runtime_identity_prepare.sh | tee q1-translator.txt
          grep -Fq 'com.ramybaheeg.togglebay' scripts/gate2a_runtime_qa.sh
          grep -Fq 'com.ramybaheeg.togglebay' scripts/publication_screen_on_card_qa.sh
          grep -Fq 'package com.ramybaheeg.togglebay.qaconsumer;' scripts/publication_folder_backup_share_qa.sh
          ! grep -Fq 'package com.painless.pc.qaconsumer;' scripts/publication_folder_backup_share_qa.sh
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'scripts/gate2a_runtime_qa.sh': [r'com\.painless\.pc:id/my_switch', r'com\\.painless\\.pc:id/my_switch'],
              'scripts/publication_screen_on_card_qa.sh': [r'pkg=com\.painless\.pc', r'pkg=com\\.painless\\.pc'],
          }
          stale=[]
          for name, needles in checks.items():
              text=Path(name).read_text()
              for needle in needles:
                  if needle in text:
                      stale.append(f'{name}: {needle}')
          if stale:
              raise SystemExit('Escaped legacy runtime package survived translator:\n' + '\n'.join(stale))
          print('Escaped runtime identity translation: PASS')
          PY
          git diff -- scripts > q1-translator-diff.patch

      - name: Package Q1 evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p q1-evidence
          git rev-parse HEAD > q1-evidence/head.txt
          git rev-parse HEAD^{tree} > q1-evidence/tree.txt
          git status --short > q1-evidence/git-status.txt
          cp q1-apk-badging.txt q1-aab-integrity.txt q1-build-sha256.txt q1-debug-merged-manifest.xml q1-release-merged-manifest.xml \
             q1-packaged-resources.txt q1-unexpected-legacy-brand.txt q1-translator.txt q1-translator-diff.patch q1-evidence/ 2>/dev/null || true
          find release-identity/res -type f -maxdepth 3 -print | sort > q1-evidence/identity-overlay-files.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q1-togglebay-identity-closure-${{ github.sha }}
          path: q1-evidence
          if-no-files-found: error
