buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.application'

android {
    // Keep the restored Java/R namespace stable; the independent public package is
    // applicationId below so customer installs do not collide with historical Power Toggles.
    namespace "com.painless.pc"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.ramybaheeg.togglebay"
        minSdkVersion 16
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    sourceSets {
        main {
            res.srcDirs = ['res']
            java.srcDirs = ['src']
            manifest.srcFile 'AndroidManifest.xml'
        }
        debug {
            java.srcDirs = ['qa-debug/src']
            manifest.srcFile 'qa-debug/AndroidManifest.xml'
        }
    }
    lintOptions {
        disable 'MissingTranslation'
        disable 'ManifestResource'
        // The legacy config layout intentionally reuses btn_1/btn_2/btn_3 inside
        // section-specific containers. All consumers scope lookup to their container.
        disable 'DuplicateIds'
    }
}
